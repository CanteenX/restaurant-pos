LONGDESC=' Nventra POS is an open-source restaurant POS with tables, a kitchen
 display, reservations, QR ordering and loyalty. This package installs a systemd
 service that runs the published, version-pinned Nventra POS containers and a
 PostgreSQL database with Docker Compose, keeping all data in Docker volumes on
 this machine. Open http://localhost:1995 after installing.
 .
 Settings are in /etc/nventra-pos/nventra-pos.env. Upgrade with your package
 manager; back up your data first.'

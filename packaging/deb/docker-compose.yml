services:
  postgres:
    image: postgres:16-alpine
    container_name: nventra-pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nventra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD in /etc/nodedr-orderrestro/nodedr-orderrestro.env}
      POSTGRES_DB: nventra_pos
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nventra -d nventra_pos"]
      interval: 5s
      timeout: 5s
      retries: 10
  db-setup:
    image: ghcr.io/canteenx/nventra-pos-backend:@VERSION@
    container_name: nventra-pos-db-setup
    command: ["setup"]
    environment:
      NVENTRA_DB_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD in /etc/nodedr-orderrestro/nodedr-orderrestro.env}
      NVENTRA_DATABASE_URL_FILE: /run/nventra-db/runtime-url
    volumes:
      - db_runtime_auth:/run/nventra-db
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    image: ghcr.io/canteenx/nventra-pos-backend:@VERSION@
    container_name: nventra-pos-backend
    restart: unless-stopped
    environment:
      NVENTRA_DATABASE_URL_FILE: /run/nventra-db/runtime-url
      SESSION_IDLE_MINUTES: "${SESSION_IDLE_MINUTES:-60}"
      SESSION_MAX_HOURS: "${SESSION_MAX_HOURS:-12}"
      PORT: "4000"
      CORS_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:1995}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      UPLOADS_DIR: "/data/uploads"
      VERIFACTU_PRODUCER_ID: "${VERIFACTU_PRODUCER_ID:-}"
      VERIFACTU_PRODUCER_NAME: "${VERIFACTU_PRODUCER_NAME:-}"
      VERIFACTU_PRODUCER_COUNTRY: "${VERIFACTU_PRODUCER_COUNTRY:-}"
      VERIFACTU_SYSTEM_ID: "${VERIFACTU_SYSTEM_ID:-}"
    depends_on:
      db-setup:
        condition: service_completed_successfully
    expose:
      - "4000"
    volumes:
      - db_runtime_auth:/run/nventra-db:ro
      - uploads_data:/data/uploads
      - state:/data/state
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - 'c 189:* rmw'
      - 'c 180:* rmw'
  web:
    image: ghcr.io/canteenx/nventra-pos-web:@VERSION@
    container_name: nventra-pos-web
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-1995}:3000"
    depends_on:
      - backend
volumes:
  pg_data:
  db_runtime_auth:
  uploads_data:
  state:

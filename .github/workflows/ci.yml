name: CI

# Deterministic gate for PRs into staging/master. On the free GitHub plan there
# is no branch protection, so the merger agent treats a green run of this
# workflow as the merge gate.
#
# MINUTES BUDGET: the CanteenX org shares 2,000 Actions minutes/month across
# ALL repos. This workflow is deliberately lean:
#   - PRs only (no extra run on push to staging), docs-only PRs skipped
#   - one runner, pnpm store cached, superseded runs cancelled
#   - backend e2e (Postgres) only when backend/types/prisma files change
#   - Control browser QA only when Control or shared inputs change
# POS browser QA stays in the separate scheduled e2e.yml workflow.

on:
  pull_request:
    branches: [staging, master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "casaos/*.png"
      - "mobile/store/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ci-gate
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04 # Keep Playwright 1.56.1 on a supported runner.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - name: What changed
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            db_runtime:
              - "docker-compose.yml"
              - "casaos/docker-compose.yml"
              - "packaging/deb/docker-compose.yml"
              - "updater/**"
              - "apps/backend/Dockerfile"
              - "apps/backend/container-entrypoint.sh"
              - "apps/backend/src/system/db-*.ts"
              - "apps/backend/src/backup/{pg-exec,restore-role}.ts"
              - "apps/backend/src/sync/{capture-install,sync.service}.ts"
              - "apps/backend/prisma/**"
              - "scripts/test-db-runtime*"
              - ".github/workflows/ci.yml"
            backend:
              - "apps/backend/**"
              - "packages/types/**"
              - "pnpm-lock.yaml"
            control:
              - "apps/control/**"
              - "apps/control-api/**"
              - "packages/types/**"
              - "pnpm-lock.yaml"
              - "e2e/control/**"
              - "e2e/control-qa.sh"
              - "e2e/control-seed.test.cjs"
              - "e2e/playwright.control.config.ts"
              - "e2e/package.json"
              - "e2e/package-lock.json"
              - "pnpm-workspace.yaml"
              - ".github/workflows/ci.yml"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build shared types + Prisma client
        run: |
          pnpm --filter "./packages/types" build
          pnpm --filter "./apps/backend" exec prisma generate

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Unit tests
        run: pnpm -r --if-present test

      - name: Release image drift guard
        run: node --test scripts/release-images.test.cjs scripts/upgrade-docs.test.cjs scripts/published-install-docs.test.cjs

      - name: Control table accessibility checks
        run: node --test e2e/control-table-access.test.cjs

      - name: Managed database startup, recovery and PostgreSQL role checks
        if: steps.changes.outputs.db_runtime == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          pnpm --filter "./apps/backend" build
          node --test updater/server.test.js scripts/test-db-runtime-startup.cjs
          bash scripts/test-db-runtime-role.sh

      - name: Backend e2e (only when backend changed)
        if: steps.changes.outputs.backend == 'true'
        working-directory: apps/backend
        run: pnpm exec prisma migrate deploy && pnpm test:e2e

      - name: Control Playwright (only when Control changed)
        if: steps.changes.outputs.control == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CONTROL_QA_INSTALL_CHROMIUM: "1"
        run: bash e2e/control-qa.sh

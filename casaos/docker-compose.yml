name: nodedr-restaurant-pos

services:
  postgres:
    image: postgres:16-alpine
    container_name: nventra-pos-postgres
    hostname: nventra-pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nventra
      POSTGRES_PASSWORD: "please-change-this-password"
      POSTGRES_DB: nventra_pos
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nventra -d nventra_pos"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nodedr-restaurant-pos

  db-setup:
    image: ghcr.io/canteenx/nventra-pos-backend:1.1.0
    container_name: nventra-pos-db-setup
    command: ["setup"]
    environment:
      NVENTRA_DB_HOST: nventra-pos-postgres
      POSTGRES_PASSWORD: "please-change-this-password"
      NVENTRA_DATABASE_URL_FILE: /run/nventra-db/runtime-url
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/db-runtime-auth
        target: /run/nventra-db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nodedr-restaurant-pos
    x-casaos:
      envs:
        - container: POSTGRES_PASSWORD
          description:
            en_US: Must match the bootstrap password in the postgres service.

  backend:
    image: ghcr.io/canteenx/nventra-pos-backend:1.1.0
    container_name: nventra-pos-backend
    # Lets the updater (updater/server.js) tell a good update from a broken
    # one: a new version that never reports healthy is rolled back. The long
    # start_period covers `prisma migrate deploy` on a slow box.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    hostname: nventra-pos-backend
    restart: unless-stopped
    environment:
      NVENTRA_DATABASE_URL_FILE: /run/nventra-db/runtime-url
      # No JWT_SECRET here on purpose — the app generates a real random one
      # itself on first boot and persists it to the /data/state volume
      # below (see apps/backend/src/main.ts's resolveJwtSecret()). A
      # hardcoded placeholder here would either be a real security hole
      # (most CasaOS installers never change it) or, since a later backend
      # update made the app refuse to boot with a known placeholder value,
      # a broken install out of the box — this way nobody ever has to
      # touch it and it still works correctly.
      SESSION_IDLE_MINUTES: "60"
      SESSION_MAX_HOURS: "12"
      PORT: "4000"
      CORS_ORIGIN: "http://localhost:1995"
      COOKIE_SECURE: "false"
      UPLOADS_DIR: "/data/uploads"
      # Spain VERI*FACTU producer identifier (see docs/verifactu.md). Only needed for Spanish installs.
      VERIFACTU_PRODUCER_ID: ""
      # Set to a long random key to make this server the sync hub for Windows
      # PCs (Settings > Server Sync). Empty = sync server off.
      SYNC_API_KEY: ""
      # In-app "Update now" button (Settings > Updates) -> the updater below.
      UPDATER_URL: "http://nventra-pos-updater:8080"
      # Change to the SAME long random value here and in the updater service
      # (e.g. `openssl rand -hex 32`). The updater refuses this placeholder,
      # so in-app updates stay off until you do.
      UPDATER_TOKEN: "change-me-to-a-long-random-updater-token"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/db-runtime-auth
        target: /run/nventra-db
        read_only: true
      - type: bind
        source: /DATA/AppData/$AppID/uploads
        target: /data/uploads
      - type: bind
        source: /DATA/AppData/$AppID/state
        target: /data/state
    depends_on:
      db-setup:
        condition: service_completed_successfully
    networks:
      - nodedr-restaurant-pos
    x-casaos:
      envs:
        - container: CORS_ORIGIN
          description:
            en_US: Origin allowed to call the API (CORS). Leave as the default for local/LAN use — only change for a VPS behind real HTTPS.
        - container: VERIFACTU_PRODUCER_ID
          description:
            en_US: Spain only. The software producer's identifier for VERI*FACTU records (at most 20 characters). Leave empty outside Spain.
        - container: COOKIE_SECURE
          description:
            en_US: Set to true only when served over real HTTPS. Leave false for plain local/LAN use — a true value on plain HTTP silently breaks login (the session cookie gets dropped by the browser).
        - container: UPDATER_TOKEN
          description:
            en_US: Secret shared with the updater (which controls Docker). Set the same long random value (e.g. openssl rand -hex 32) here and in the updater. The placeholder is refused, so in-app updates stay off until you change it.
      volumes:
        - container: /data/uploads
          description:
            en_US: Uploaded images (menu items, staff avatars, etc.) — back this up.
        - container: /data/state
          description:
            en_US: Auto-generated login security key. Created automatically on first launch — leave it alone.

  web:
    image: ghcr.io/canteenx/nventra-pos-web:1.1.0
    container_name: nventra-pos-web
    # Next binds to $HOSTNAME (the container's own address), not 127.0.0.1.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://'+(process.env.HOSTNAME||'127.0.0.1')+':3000/login',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    hostname: nventra-pos-web
    restart: unless-stopped
    ports:
      - target: 3000
        published: "1995"
        protocol: tcp
    depends_on:
      - backend
    networks:
      - nodedr-restaurant-pos
    x-casaos:
      ports:
        - container: "3000"
          description:
            en_US: Nventra POS web interface
          protocol: tcp

  # In-app "Update now" (Settings > Updates): pulls the newer Nventra POS
  # images above. It runs database setup before replacing the API. This
  # separate container runs the updater command and holds the Docker socket.
  updater:
    image: ghcr.io/canteenx/nventra-pos-backend:1.1.0
    container_name: nventra-pos-updater
    command: ["node", "/repo/updater/server.js"]
    hostname: nventra-pos-updater
    restart: unless-stopped
    environment:
      # Must match the backend's UPDATER_TOKEN; see the note there.
      UPDATER_TOKEN: "change-me-to-a-long-random-updater-token"
      TARGET_CONTAINERS: "nventra-pos-backend,nventra-pos-web"
      DB_SETUP_CONTAINER: nventra-pos-db-setup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - nodedr-restaurant-pos
    x-casaos:
      envs:
        - container: UPDATER_TOKEN
          description:
            en_US: Secret shared with the updater (which controls Docker). Set the same long random value (e.g. openssl rand -hex 32) here and in the backend. The placeholder is refused, so in-app updates stay off until you change it.
      volumes:
        - container: /var/run/docker.sock
          description:
            en_US: Docker socket, used only by the in-app "Update now" button to move the two Nventra POS containers to a newer version.

networks:
  nodedr-restaurant-pos:
    driver: bridge

x-casaos:
  id: com.nodedr.orderrestro
  architectures:
    - amd64
    - arm64
  main: web
  author: Nventra
  developer: CanteenX
  category: Finance
  icon: https://cdn.jsdelivr.net/gh/CanteenX/restaurant-pos@master/casaos/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/CanteenX/restaurant-pos@master/casaos/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/CanteenX/restaurant-pos@master/casaos/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/CanteenX/restaurant-pos@master/casaos/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/CanteenX/restaurant-pos@master/casaos/screenshot-3.png
  title:
    en_US: Nventra POS
  tagline:
    en_US: Offline-first restaurant management — POS, kitchen display, tables, and reservations
  description:
    en_US: |
      Nventra POS (a fork of Nodedr OrderRestro) is a free, open-source restaurant management system:
      point-of-sale ordering, a live kitchen display (KDS) split by station,
      table/floor management with QR-code table ordering, reservations and a
      waitlist, inventory with automatic ingredient deduction, customer CRM
      with loyalty points and gift cards, and full billing (splits, tips,
      discounts, refunds). Runs entirely on your own hardware — no
      subscription, no data leaving your server.

      Access it from any device on your home network at
      `http://<your-server>:1995` — a till, a waiter's tablet, or the
      kitchen's own display.
  tips:
    before_install:
      en_US: |
        Login security is handled automatically — no setup needed there.

        **Before anything beyond a quick local trial**, change the
        placeholder Postgres password. Set the same `POSTGRES_PASSWORD`
        in `postgres` and `db-setup` for a fresh installation. For an
        existing installation, use its original database password and
        keep its existing AppData paths.

        To use the in-app **Update now** button, also set `UPDATER_TOKEN`
        to the same long random value (e.g. `openssl rand -hex 32`) in
        both the `backend` and `updater` services. The updater controls
        Docker, so it refuses the placeholder and in-app updates stay off
        until you change it.

        Your data (Postgres database + uploaded images) persists at
        `/DATA/AppData/nodedr-restaurant-pos/`, following CasaOS/ZimaOS's
        standard backup/restore convention.

        After install, sign up for a new restaurant account from the app's
        `/signup` page — no manual configuration or demo data needed.
  index: /
  scheme: http
  port_map: "1995"
  version: "1.1.0"
  update_at: "2026-11-24"
  release_notes:
    en_US: |-
      1.1.0: adds Hindi coverage, safer email and restore handling, and restricted
      database logins. Back up first and apply the new CasaOS definition to upgrade.

  website: "https://github.com/CanteenX/restaurant-pos"
  repo: "https://github.com/CanteenX/restaurant-pos"
  support: "https://github.com/CanteenX/restaurant-pos/issues"
  docs: "https://github.com/CanteenX/restaurant-pos#readme"
